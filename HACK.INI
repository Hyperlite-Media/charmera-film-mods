# Charmera mod settings. Edit on your computer, copy to the SD card root
# next to HACK.BIN, and power the camera on. Use on/off.

# Open the camera in photo mode after the Kodak logo, skipping the options screen
boot_to_photo = on

# LED flash: auto (camera fires it in low light), on (every photo) or off (never).
# Also in the camera menu (play button) as FLASH.
flash = auto

# Interface language for the camera's own menus: 0 = English (11 languages in total).
# Also blocks the hidden button combination that switches language.
language = 0

# All 12 filter modes become Kodak film looks (replaces "presets" below):
#  0 Gold 200      1 Portra 160     2 Portra 400   3 Portra 800
#  4 Ektar 100     5 UltraMax 400   6 ColorPlus 200 7 Ektachrome E100
#  8 Kodachrome 64 9 Vision3 500T  10 Tri-X 400    11 BW400CN
film_modes = on

# Show the film name on screen when switching modes (replaces the stock filter icon)
film_names = on
# How long to show it, in preview frames (about 30 per second); 0 = always show
film_name_frames = 60

# In photo mode, the play button opens a settings menu for the current film:
# up/down change the value, play = next setting, shutter = close and save.
# The gallery is the last item (or use power > playback).
film_menu = on

# Film border on saved photos: edges, sprocket holes and film name. Turn it on or off for
# each film with BORDER in the camera menu. "off" here hides all borders.
film_borders = on

# Exposure compensation for all films, in 1/3 stops: -6 (2 stops darker) to +6
# (2 stops brighter). 0 = camera default.
exposure = 0

# Contrast for all films: -100 (flat) to 100 (punchy), added to each film's own. 0 = as set.
contrast = 0

# Optional: fine-tune a look. Numbers: U offset, V offset, U gain, V gain,
# then optionally: exposure in 1/3 stops (added to "exposure"),
# contrast (-100..100), fade (0..64, lifts the blacks) and white balance
# (0 auto, 1 daylight, 2 cloudy, 3 tungsten, 4 fluorescent), and sharpness
# (-30 = no sharpening ... 150 = very crisp; 0 = camera default), and border (0 off, 1 on).
#   U offset: + bluer, - yellower    V offset: + redder, - greener
#   gains: 32 = normal saturation, 0 = black and white
# Remove the leading # to use a line. These are the built-in values:
#film0  = -8 5 38 38 0 15 0 0 0 1
#film1  = -3 2 28 28 1 -15 8 0 -8 1
#film2  = -5 4 30 31 1 -10 6 0 -8 1
#film3  = -7 6 33 34 1 -5 6 0 -8 1
#film4  = 2 3 46 48 0 30 0 0 8 1
#film5  = -6 4 40 40 0 20 0 0 0 1
#film6  = -10 6 30 30 0 -5 12 0 -8 1
#film7  = 6 -2 42 40 -1 35 0 0 4 1
#film8  = -4 7 40 46 -1 40 0 0 8 1
#film9  = 14 -8 30 30 0 -20 10 0 -12 1
#film10 = 0 0 0 0 0 45 0 0 12 1
#film11 = -4 3 0 0 0 -10 6 0 -4 1

# Used only when film_modes is off: filter modes 1-3 become Warm / Vivid / Faded
presets = on

# Click when pressing buttons and scrolling through menus and photos
click_sound = off

# Shutter sound when taking a photo
shutter_sound = on

# Sound when switching off (the power-on sound plays before the card is read)
poweroff_sound = on

# Diagnostics: record every button/event message in photo mode to HACKKEYS.TXT
key_log = off
